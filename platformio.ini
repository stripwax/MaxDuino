; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./MaxDuino

[common]
lib_deps = 
	greiman/SdFat@2.3.1
	https://github.com/felias-fogg/SoftI2CMaster.git#V2.1.9
	bxparks/AceWire@^0.4.1
	watterott/digitalWriteFast@^1.0.0
extra_scripts = 
	pre:extra_script.py
build_flags =
	-Wl,--relax
	-fmerge-all-constants
	-fno-threadsafe-statics
	-fno-use-cxa-atexit
	-fno-rtti
	-fno-exceptions
	-Os
avr_build_flags =
	${common.build_flags}
	-fshort-enums  # not safe for {common.build_flags} as causes isr failure on ESP32C3
	-flto
	-mcall-prologues
samd21_build_flags =
	${common.build_flags}
build_unflags =
	-fno-lto

[base]
framework = arduino
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}

[base_nano_avr]
extends = base
board = nanoatmega328
board_upload.maximum_ram_size = 1835
platform = atmelavr
build_flags =
	${common.avr_build_flags}
	-DENABLE_DEDICATED_SPI=0
	-DUSE_FAT_FILE_FLAG_CONTIGUOUS=0
	-DCHECK_FLASH_PROGRAMMING=0

[env:seeed_xiao_samd21]
extends = base
platform = atmelsam
board = seeed_xiao
lib_ignore = USBHost
lib_archive = no
lib_deps = 
	${base.lib_deps}
	khoih-prog/FlashStorage_SAMD@^1.3.2
build_flags = 
	${common.samd21_build_flags}
	-DUSE_TINYUSB
	-I "${PROJECT_CORE_DIR}/packages/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src/arduino"

[env:seeed_xiao_samd21_ricky_test_board]
extends = env:seeed_xiao_samd21
build_flags = 
	-DRICKY_TEST_BOARD
	${env:seeed_xiao_samd21.build_flags}
	-DRECORD

[env:Nano328p]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=7

[env:Nano328p_LCD16]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=0

[env:Nano328p_CF0]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=0

[env:Nano328p_CF1]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=1

[env:Nano328p_CF2]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=2

[env:Nano328p_CF3]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=3

[env:Nano328p_CF4]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=4

[env:Nano328p_CF5]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=5

[env:Nano328p_CF6]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=6

[env:Nano328p_CF7]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=7
	-DLOGO=Maxduino7
	-DFONT=cartoonFont

[env:Nano328p_New]
extends = base_nano_avr
board = nanoatmega328new
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=7

[env:Nano328p_NO_BOOTLOADER_OLED1306]
extends = base_nano_avr
build_flags =
	${base_nano_avr.build_flags}
	-DCONFIGFILE=11
upload_protocol = usbasp
upload_flags =
	# -B 32  ## SLOWS DOWN IN CASE OF PROBLEMS WRITING FASTER
	-e  ## need -e to erase!
board_upload.maximum_size = 32768
board_fuses.lfuse = 0xff
board_fuses.hfuse = 0xd3
board_fuses.efuse = 0xfd

[env:Nano328p_NO_BOOTLOADER_OLED1106_1_3]
# Shares everything else with the NO_BOOTLOADER_OLED1306 with additional #define for OLED1106_1_3
extends = env:Nano328p_NO_BOOTLOADER_OLED1306
build_flags =
	${env:Nano328p_NO_BOOTLOADER_OLED1306.build_flags}
	-DOLED1106_1_3  

[env:megaatmega2560_MegaDuino]
extends = base
platform = atmelavr
board = megaatmega2560
build_flags =
	${common.avr_build_flags}

[env:ATMEGA32u4_Miniduino]
extends = base_nano_avr
board = leonardo
build_flags =
	${base_nano_avr.build_flags}

[env:ThinaryNanoEvery_MaxduinoUltimate]
extends = base
platform = atmelmegaavr
board = ATmega4808
board_build.f_cpu = 16000000L
board_hardware.oscillator = internal
board_build.variant = nano-4808

[env:NanoEvery_MaxduinoUltimate]
extends = base
platform = atmelmegaavr
board = ATmega4809
board_build.f_cpu = 16000000L
board_hardware.oscillator = internal
board_build.variant = nano-every
board_upload.use_1200bps_touch = true

[env:wemos_d1_mini8266]
extends = base
platform = espressif8266
board = d1_mini
lib_deps = ${common.lib_deps}
	jwrw/ESP_EEPROM@^2.2.1

[env:wemos_d1_mini8266_ricky_test_board]
extends = base
platform = espressif8266
board = d1_mini
lib_deps = ${common.lib_deps}
	jwrw/ESP_EEPROM@^2.2.1
build_flags = 
	-DRICKY_TEST_BOARD

[env:seeed_xiao_ESP32C3]
extends = base
platform = espressif32
board = seeed_xiao_esp32c3

[env:seeed_xiao_ESP32C3_ricky_test_board]
extends = base
platform = espressif32@5.4.0
board = seeed_xiao_esp32c3
build_flags = 
	-DRICKY_TEST_BOARD

[env:STM32_MapleMiniDuino]
extends = base
platform = ststm32
board = maple_mini_origin
board_build.core = maple
board_build.f_cpu = 72000000L
  
; Lotharek device untested and has reported issues, so we need a donor to confirm build configuration
[env:STM32_MaxDuino_Mini_Lotharek_maple_build]
extends = base
platform = ststm32
board = genericSTM32F103C8
board_build.core = maple
board_build.mcu = stm32f103c8t6
board_build.f_cpu = 72000000L

[env:RaspberryPiPico]
extends = base
platform = https://github.com/maxgerhardt/platform-raspberrypi.git  ; official PlatformIO raspberrypi platform has been abandoned, this community fork is highly regarded and maintained
board = pico
board_build.core = earlephilhower
board_build.filesystem_size = 0m ; not using LittleFS (.. yet?)

[env:seeed_xiao_rp2040]
extends = base
platform = https://github.com/maxgerhardt/platform-raspberrypi.git  ; official PlatformIO raspberrypi platform has been abandoned, this community fork is highly regarded and maintained
board = seeed_xiao_rp2040
board_build.core = earlephilhower
board_build.filesystem_size = 0m ; not using LittleFS (.. yet?)

[env:seeed_xiao_rp2040_ricky_test_board]
extends = base
platform = https://github.com/maxgerhardt/platform-raspberrypi.git  ; official PlatformIO raspberrypi platform has been abandoned, this community fork is highly regarded and maintained
board = seeed_xiao_rp2040
board_build.core = earlephilhower
board_build.filesystem_size = 0m ; not using LittleFS (.. yet?)
build_flags =
	-DRICKY_TEST_BOARD

[env:seeed_xiao_rp2350]
extends = base
platform = https://github.com/maxgerhardt/platform-raspberrypi.git  ; official PlatformIO raspberrypi platform has been abandoned, this community fork is highly regarded and maintained
board = seeed_xiao_rp2350
board_build.core = earlephilhower
board_build.filesystem_size = 0m ; not using LittleFS (.. yet?)

[env:wemos_d1_mini32]
extends = base
platform = espressif32
board = wemos_d1_mini32
build_flags =
	-DWEMOS_D1_MINI32=1 ; just used to identify the board (i.e. pin layout)

[env:wemos_d1_mini32_ricky_test_board]
extends = base
platform = espressif32
board = wemos_d1_mini32
build_flags =
	-DWEMOS_D1_MINI32=1 ; just used to identify the board (i.e. pin layout)
	-DRICKY_TEST_BOARD
	

[env:NanoEvery_Zaxon]
extends = base
platform = atmelmegaavr
board = ATmega4809
board_build.f_cpu = 16000000L
board_hardware.oscillator = internal
board_build.variant = nano-every
board_fuses.syscfg0 = 0xC9
board_fuses.bootend = 0x00
board_fuses.osccfg = 0x01
board_upload.extraflags = -VeD
board_upload.maximum_ram_size = 6144
board_upload.maximum_size = 48640
board_upload.use_1200bps_touch = true
board_upload.speed = 115200
build_flags =
	-DBUTTONS_REVERSED
	-DUSEICONS
	-DTURBO_MODES
	-DCONFIGFILE=7
	-DscrollWait=1500
	-DscrllSpeed=150
monitor_speed = 115200



[env:ARDUINO_NANO_ESP32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = arduino_nano_esp32
upload_speed = 921600
upload_protocol = dfu
monitor_speed = 115200
monitor_filters=esp32_exception_decoder
lib_deps = 
	braydenanderson2014/DoubleLinkedList
	adafruit/Adafruit TinyUSB Library
	;greiman/SdFat@2.3.1
extra_scripts = ${common.extra_scripts}
lib_archive = no
lib_ignore  = ble
             wifi
             ESP RainMaker
             ESP Insights
             spiffs
             NetworkClientSecure
             Zigbee
             Matter
             OpenThread
             dsp
build_flags=
	-O3
	-Wall
	-DI2C_Library_Preference=_I2C_Impl_Wire ; silences warning about unsupported SoftI2CMaster
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_DFU_ON_BOOT=1
	-DARDUINO_USB_CDC_ON_BOOT=1
  	;-DCORE_DEBUG_LEVEL=3
  	-DBOARD_HAS_PSRAM=1
	-mfix-esp32-psram-cache-issue
  	-DCONFIG_SPIRAM_CACHE_WORKAROUND=1
  	-DCONFIG_SPIRAM_FETCH_INSTRUCTIONS=1
  	-DCONFIG_SPIRAM_RODATA=1
  	-DARDUINO_RUNNING_CORE=1
  	-DARDUINO_EVENT_RUNNING_CORE=1
  	-D CONFIG_DISABLE_HAL_LOCKS
	-D USE_TINYUSB